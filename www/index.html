<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كاشير المحل</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f4;--card:#fff;--tx:#1c2a26;--mut:#6b7c76;--pri:#0f7a5c;--pri2:#0b5e47;--bd:#dde4e1;--red:#c0392b;--amb:#d98e04;--side:#12332b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#e6efec;--mut:#92a39d;--bd:#2c3a35;--side:#0c211c}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--tx:#e6efec;--mut:#92a39d;--bd:#2c3a35;--side:#0c211c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
#app{display:flex;min-height:100vh}
nav{width:210px;background:var(--side);color:#fff;padding:10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:18px;margin:8px 6px 14px}
nav button{display:block;width:100%;text-align:right;background:none;border:0;color:#cfe3dc;padding:11px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px}
nav button.on,nav button:hover{background:var(--pri);color:#fff}
main{flex:1;padding:14px;min-width:0}
.top{display:none;background:var(--side);color:#fff;padding:10px 14px;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top button{background:none;border:0;color:#fff;font-size:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}.stat span{color:var(--mut);font-size:13px}
h2{margin:0 0 12px;font-size:19px}h3{margin:0 0 8px;font-size:16px}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:6px 0 3px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
.btn:hover{background:var(--pri2)}.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--red)}.btn.s{padding:5px 10px;font-size:13px}.btn.big{width:100%;font-size:18px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:110px}.row>.btn{flex:0 0 auto}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--mut);font-size:13px}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.res{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:230px;overflow:auto}
.res button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#fde8e5;color:var(--red)}.tag.o{background:#fff3d6;color:#8a5a00}
.tot{font-size:26px;font-weight:700;color:var(--pri)}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal>div{background:var(--card);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:30}
#pr{display:none}
@media (max-width:820px){#app{display:block}nav{position:fixed;right:-230px;top:0;z-index:10;transition:.2s}nav.open{right:0}.top{display:flex}.pos{grid-template-columns:1fr}}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;color:#000;background:#fff;padding:10px;font-size:13px}#pr th,#pr td{border-bottom:1px solid #999}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js" defer></script></head>
<body>
<div class="top"><button onclick="document.querySelector('nav').classList.toggle('open')">☰</button><b>كاشير المحل</b></div>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="modal"><div id="mbox"></div></div><div id="toast"></div><div id="pr"></div>
<script>
const KEY='kasher_v1';
let S={products:[],customers:[],suppliers:[],sales:[],purchases:[],expenses:[],payments:[],held:[],seq:{s:1,p:1},pass:'',shop:'محلي التجاري'};
const ST=(()=>{
 if(window.kasherStore){const k=window.kasherStore;return{where:k.where,read:async()=>k.read(),write:async t=>k.write(t)}}
 const C=window.Capacitor,FS=C&&C.Plugins&&C.Plugins.Filesystem;
 if(FS&&C.isNativePlatform&&C.isNativePlatform()){
  const P='KasherAlMahal/data.json',E='utf8';let dir='DOCUMENTS';
  const w=async(p,t)=>{try{await FS.writeFile({path:p,data:t,recursive:true,directory:dir,encoding:E})}catch(e){if(dir==='DOCUMENTS'){dir='DATA';await FS.writeFile({path:p,data:t,recursive:true,directory:dir,encoding:E})}else throw e}};
  return{get where(){return dir==='DOCUMENTS'?'Documents/KasherAlMahal/data.json':'مجلد التطبيق الداخلي (خذ نسخة احتياطية دورية)'},
   read:async()=>{for(const d of['DOCUMENTS','DATA']){try{return (await FS.readFile({path:P,directory:d,encoding:E})).data}catch(e){}}return null},
   write:t=>w(P,t),
   exp:async(n,t)=>{try{await w('KasherAlMahal/'+n,t);toast('تم الحفظ: KasherAlMahal/'+n)}catch(e){toast('تعذّر حفظ الملف')}}}}
 return{where:'متصفح هذا الجهاز',read:async()=>localStorage.getItem(KEY),write:async t=>localStorage.setItem(KEY,t)};
})();
async function loadData(){try{const d=await ST.read();if(d)S=Object.assign(S,JSON.parse(d))}catch(e){}}
let saving=Promise.resolve();const save=()=>{const t=JSON.stringify(S);saving=saving.then(()=>ST.write(t)).catch(()=>toast('تعذّر الحفظ — خذ نسخة احتياطية'))};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const fmt=n=>(Math.round(num(n)*100)/100).toLocaleString('en-US')+' دج';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const dt=s=>new Date(s).toLocaleString('ar-DZ',{dateStyle:'short',timeStyle:'short'});
const UN={piece:'قطعة',kg:'كغ',l:'لتر',box:'علبة'};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function openM(h){$('#mbox').innerHTML=h;$('#modal').style.display='flex'}
function closeM(){$('#modal').style.display='none'}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};

const VIEWS={dash:'لوحة التحكم',pos:'الكاشير',prod:'المنتجات والمخزون',cust:'الزبائن والديون',supp:'الموردون والمشتريات',inv:'الفواتير',exp:'المصاريف والمداخيل',rep:'التقارير',set:'الإعدادات'};
let view='dash',cart=[],cartDisc=0;
function go(v){view=v;document.querySelector('nav').classList.remove('open');drawNav();R[v]();window.scrollTo(0,0)}
function drawNav(){$('#nav').innerHTML='<h1>🛒 كاشير المحل</h1>'+Object.entries(VIEWS).map(([k,v])=>`<button class="${k===view?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}
const M=h=>{$('#main').innerHTML=h};

/* ---------- حسابات ---------- */
const saleProfit=s=>s.items.reduce((a,i)=>a+(i.price-i.cost)*i.qty,0)-s.discount;
const inRange=(d,from)=>d.slice(0,10)>=from;
function lowStock(){return S.products.filter(p=>p.qty<=p.min)}
function nearExp(){const lim=new Date(Date.now()+30*864e5).toISOString().slice(0,10);return S.products.filter(p=>p.exp&&p.exp<=lim&&p.qty>0)}

const R={};
/* ---------- لوحة التحكم ---------- */
R.dash=()=>{
 const t=today(),ts=S.sales.filter(s=>inRange(s.date,t));
 const inc=ts.reduce((a,s)=>a+s.paid,0)+S.payments.filter(p=>p.who==='c'&&inRange(p.date,t)).reduce((a,p)=>a+p.amt,0);
 const exp=S.expenses.filter(e=>e.type==='exp'&&e.date===t).reduce((a,e)=>a+e.amt,0);
 const debt=S.customers.reduce((a,c)=>a+Math.max(0,c.bal),0);
 const lo=lowStock(),ne=nearExp();
 M(`<h2>لوحة التحكم</h2>
 <div class="grid"><div class="stat"><span>مبيعات اليوم</span><b>${fmt(ts.reduce((a,s)=>a+s.total,0))}</b></div>
 <div class="stat"><span>المداخيل المقبوضة</span><b>${fmt(inc)}</b></div>
 <div class="stat"><span>مصاريف اليوم</span><b>${fmt(exp)}</b></div>
 <div class="stat"><span>ديون الزبائن</span><b>${fmt(debt)}</b></div>
 <div class="stat"><span>عدد المنتجات</span><b>${S.products.length}</b></div>
 <div class="stat"><span>عدد فواتير اليوم</span><b>${ts.length}</b></div></div><br>
 <div class="row" style="align-items:stretch"><div class="card"><h3>⚠️ مخزون منخفض (${lo.length})</h3>${lo.slice(0,8).map(p=>`<div>${esc(p.name)} <span class="tag">${p.qty} ${UN[p.unit]}</span></div>`).join('')||'<span style="color:var(--mut)">لا يوجد</span>'}</div>
 <div class="card"><h3>⏳ قريبة الانتهاء (${ne.length})</h3>${ne.slice(0,8).map(p=>`<div>${esc(p.name)} <span class="tag o">${p.exp}</span></div>`).join('')||'<span style="color:var(--mut)">لا يوجد</span>'}</div></div>
 <div class="row"><button class="btn big" onclick="go('pos')">🧾 بيع جديد</button>${S.products.length?'':'<button class="btn g big" onclick="demo()">تحميل بيانات تجريبية</button>'}</div>`)};

/* ---------- الكاشير ---------- */
function findP(q){q=q.trim().toLowerCase().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));if(!q)return[];return S.products.filter(p=>p.code.toLowerCase()===q||p.barcode===q||p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q))}
R.pos=()=>{killCam();
 M(`<div class="pos"><div class="card"><h2>البحث عن منتج</h2>
 <div class="row"><input id="q" placeholder="الاسم / الرمز / الباركود (Enter)" autocomplete="off"><button class="btn g" onclick="voice()" title="صوت">🎤</button><button class="btn g" onclick="cam()" title="كاميرا">📷</button></div>
 <div class="res" id="res"></div><div class="row" style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--bd)"><input id="fp" type="number" min="0" step="any" placeholder="سلعة غير مسجّلة: اكتب السعر ثم Enter" onkeydown="if(event.key==='Enter')addFree()"><button class="btn" onclick="addFree()">+ إضافة</button></div><video id="vid" style="display:none;width:100%;margin-top:8px;border-radius:8px" playsinline></video>
 <div style="margin-top:12px" class="row"><button class="btn g" onclick="hold()">⏸ تعليق (F4)</button><button class="btn g" onclick="heldList()">▶ المعلّقة (${S.held.length})</button><button class="btn g" onclick="cart=[];cartDisc=0;R.pos()">🗑 تفريغ</button></div></div>
 <div class="card"><h2>الفاتورة</h2><div class="tw"><table><thead><tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th>المجموع</th><th></th></tr></thead><tbody id="cart"></tbody></table></div>
 <div class="row"><div><label>خصم (دج)</label><input id="disc" type="number" min="0" value="${cartDisc}" oninput="cartDisc=num(this.value);tot()"></div>
 <div><label>طريقة الدفع</label><select id="pm" onchange="tot()"><option value="cash">نقدًا</option><option value="credit">دين</option><option value="part">دفع جزئي</option></select></div></div>
 <div class="row"><div><label>الزبون</label><select id="pc" onchange="const m=$('#pm');if(this.value&&m.value==='cash')m.value='credit';else if(!this.value&&m.value!=='cash')m.value='cash';tot()"><option value="">زبون عابر</option>${S.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
 <div id="paidw" style="display:none"><label>المبلغ المدفوع</label><input id="paid" type="number" min="0" oninput="tot()"></div></div>
 <div class="row" style="margin:10px 0"><div>الإجمالي: <span class="tot" id="tt">0</span></div><div id="rest" style="color:var(--mut)"></div></div>
 <button class="btn big" onclick="checkout()">✔ إتمام البيع (F9)</button></div></div>`);
 const q=$('#q');q.focus();
 q.oninput=()=>{const r=findP(q.value).slice(0,30);$('#res').innerHTML=r.map(p=>`<button onclick="addC('${p.id}')">${esc(p.name)}<br><small>${fmt(p.sell)} · ${p.qty} ${UN[p.unit]}</small></button>`).join('')};
 q.onkeydown=e=>{if(e.key==='Enter'||(e.key==='Tab'&&q.value.trim())){e.preventDefault();scan(q.value)}};
 drawCart()};
function scan(v){v=v.trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));if(!v)return;
 const ex=S.products.find(p=>p.barcode===v||p.code.toLowerCase()===v.toLowerCase());if(ex)return addC(ex.id);
 const r=findP(v);if(r.length===1)return addC(r[0].id);
 if(!r.length){toast('غير مسجّل: '+v+' — أضفه من المنتجات أو استعمل خانة السعر');$('#q').select()}}
function addC(id){const p=S.products.find(x=>x.id===id);if(!p)return;const c=cart.find(x=>x.id===id);
 const cur=c?c.qty:0,step=(p.unit==='kg'||p.unit==='l')?0.5:1;
 if(p.qty<cur+step){toast('الكمية غير كافية في المخزون');return}
 if(c)c.qty+=step;else cart.push({id,name:p.name,price:p.sell,cost:p.buy,qty:step,unit:p.unit});
 const q=$('#q');if(q){q.value='';$('#res').innerHTML='';q.focus()}drawCart()}
function addFree(){const pr=num($('#fp').value);if(pr<=0)return toast('أدخل السعر');cart.push({id:'f'+uid(),name:'سلعة',price:pr,cost:0,qty:1,unit:'piece',free:true});$('#fp').value='';drawCart();$('#fp').focus()}
function drawCart(){const b=$('#cart');if(!b)return;
 b.innerHTML=cart.map((c,i)=>`<tr><td>${esc(c.name)}</td><td><input type="number" min="0" step="any" style="width:80px" value="${c.price}" onchange="cart[${i}].price=num(this.value);drawCart()"></td><td><input type="number" min="0" step="any" style="width:70px" value="${c.qty}" onchange="setQ(${i},this.value)"></td><td>${fmt(c.price*c.qty)}</td><td><button class="btn r s" onclick="cart.splice(${i},1);drawCart()">✕</button></td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--mut)">الفاتورة فارغة</td></tr>';tot()}
function setQ(i,v){const q=num(v),p=S.products.find(x=>x.id===cart[i].id);if(q<=0){cart.splice(i,1)}else if(p&&q>p.qty){toast('الكمية تتجاوز المخزون ('+p.qty+')');}else cart[i].qty=q;drawCart()}
const sub=()=>cart.reduce((a,c)=>a+c.price*c.qty,0);
function tot(){const t=Math.max(0,sub()-cartDisc),pm=$('#pm')?.value;if(!$('#tt'))return;$('#tt').textContent=fmt(t);$('#paidw').style.display=pm==='part'?'block':'none';
 const pd=pm==='cash'?t:pm==='credit'?0:num($('#paid').value);$('#rest').textContent=pm==='cash'?'':'المتبقي (دين): '+fmt(Math.max(0,t-pd))}
function checkout(){
 if(!cart.length)return toast('أضف منتجات أولًا');
 const total=Math.max(0,sub()-cartDisc);if(cartDisc>sub())return toast('الخصم أكبر من المجموع');
 const pm=$('#pm').value,cid=$('#pc').value;let paid=pm==='cash'?total:pm==='credit'?0:num($('#paid').value);
 if(pm!=='cash'&&!cid)return toast('اختر زبونًا لتسجيل الدين');
 if(paid<0||paid>total)return toast('المبلغ المدفوع غير صحيح');
 for(const c of cart){if(c.free)continue;const p=S.products.find(x=>x.id===c.id);if(!p||p.qty<c.qty)return toast('مخزون غير كافٍ: '+c.name)}
 const s={id:uid(),no:S.seq.s++,date:new Date().toISOString(),items:cart.map(c=>({...c})),discount:cartDisc,total,paid,cid,pm};
 cart.forEach(c=>{if(c.free)return;S.products.find(x=>x.id===c.id).qty-=c.qty});
 if(cid&&total-paid>0){const cu=S.customers.find(x=>x.id===cid);cu.bal+=total-paid;cu.log.push({date:s.date,txt:'فاتورة رقم '+s.no,amt:total-paid})}
 S.sales.push(s);save();cart=[];cartDisc=0;const cu2=S.customers.find(x=>x.id===cid);toast(cu2&&total-paid>0?'أُضيف '+fmt(total-paid)+' إلى دين '+cu2.name+' — رصيده الآن '+fmt(cu2.bal):'تم البيع بنجاح');R.pos();showInv(s.id)}
function hold(){if(!cart.length)return;S.held.push({id:uid(),cart:cart.map(c=>({...c})),disc:cartDisc,t:new Date().toISOString()});save();cart=[];cartDisc=0;toast('تم تعليق الفاتورة');R.pos()}
function heldList(){openM(`<h2>الفواتير المعلّقة</h2>${S.held.map(h=>`<div class="card row"><div>${dt(h.t)} — ${h.cart.length} صنف</div><button class="btn s" onclick="resume('${h.id}')">استرجاع</button><button class="btn r s" onclick="S.held=S.held.filter(x=>x.id!=='${h.id}');save();closeM();R.pos()">حذف</button></div>`).join('')||'لا توجد'}<button class="btn g" onclick="closeM()">إغلاق</button>`)}
function resume(id){const h=S.held.find(x=>x.id===id);if(cart.length)return toast('أفرغ الفاتورة الحالية أولًا');cart=h.cart;cartDisc=h.disc;S.held=S.held.filter(x=>x.id!==id);save();closeM();R.pos()}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('الإدخال الصوتي غير مدعوم في هذا المتصفح');
 const r=new SR();r.lang='ar-DZ';r.onresult=e=>{const q=$('#q');q.value=e.results[0][0].transcript;q.oninput();toast('راجع النتيجة ثم اختر المنتج')};r.onerror=()=>toast('تعذّر التقاط الصوت');r.start();toast('تحدّث الآن…')}
let stream;
function killCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const v=$('#vid');if(v)v.style.display='none'}
let lastC='',lastT=0;
async function cam(){
 if(stream)return killCam();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast('الكاميرا غير متاحة هنا — افتح الرابط في المتصفح مباشرة');
 const v=$('#vid');
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;v.muted=true;v.setAttribute('playsinline','');v.style.display='block';await v.play()}
 catch(e){stream=null;return toast(e.name==='NotAllowedError'?'إذن الكاميرا مرفوض: اسمح به من إعدادات المتصفح أو افتح الرابط في صفحة مستقلة':'تعذّر تشغيل الكاميرا ('+e.name+')')}
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let bd=null,mr=null;
 if('BarcodeDetector' in window)bd=new BarcodeDetector();else if(window.ZXing)mr=new ZXing.MultiFormatReader();else{killCam();return toast('تعذّر تحميل قارئ الباركود — تحقق من الإنترنت')}
 const loop=async()=>{if(!stream)return;let code=null;
  try{if(v.videoWidth){if(bd){const b=await bd.detect(v);if(b.length)code=b[0].rawValue}else{cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);code=mr.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText()}}}catch(e){}
  if(code&&(code!==lastC||Date.now()-lastT>2500)){lastC=code;lastT=Date.now();scan(code);if(navigator.vibrate)navigator.vibrate(60)}
  setTimeout(loop,350)};loop()}

 .forEach(([name,code,barcode,buy,sell,qty,unit],i)=>S.products.push({id:uid(),name,code,barcode,buy,sell,qty,min:5,unit,exp:i===2?new Date(Date.now()+10*864e5).toISOString().slice(0,10):''}));
 if(!S.customers.length)S.customers.push({id:uid(),name:'محمد بن علي',phone:'0550000000',bal:0,log:[]});if(!S.suppliers.length)S.suppliers.push({id:uid(),name:'مورد المواد الغذائية',phone:'0660000000',bal:0});
 save();toast('تم تحميل البيانات التجريبية');go('prod')}

/* ---------- الدخول ---------- */
function start(){go('dash')}
loadData().then(()=>{if(S.pass){openM(`<h2>🔒 تسجيل الدخول</h2><input id="lp" type="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')login()"><div style="margin-top:12px"><button class="btn big" onclick="login()">دخول</button></div>`);$('#modal').onclick=null;setTimeout(()=>$('#lp').focus(),50);drawNav()}else start();});
function login(){if(btoa(unescape(encodeURIComponent($('#lp').value)))===S.pass){closeM();$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};start()}else toast('كلمة المرور خاطئة')}
</script>
